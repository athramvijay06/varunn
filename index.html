
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="form-box">
            <h1>Event Registration</h1>
            <p>Register now and be part of our event!</p>

            <form id="registrationForm" novalidate>

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name"
                           placeholder="Enter your full name">
                    <small id="nameError"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                           placeholder="Enter your email">
                    <small id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone"
                           placeholder="Enter 10-digit phone number">
                    <small id="phoneError"></small>
                </div>

                <div class="form-group">
                    <label for="event">Select Event</label>
                    <select id="event">
                        <option value="">Choose an event</option>
                        <option value="Web Development Workshop">
                            Web Development Workshop
                        </option>
                        <option value="Coding Competition">
                            Coding Competition
                        </option>
                        <option value="Tech Seminar">
                            Tech Seminar
                        </option>
                        <option value="Career Guidance">
                            Career Guidance
                        </option>
                    </select>
                    <small id="eventError"></small>
                </div>

                <div class="form-group">
                    <label for="date">Event Date</label>
                    <input type="date" id="date">
                    <small id="dateError"></small>
                </div>

                <button type="submit">Register Now</button>

                <div id="successMessage" role="status"
                     aria-live="polite"></div>

            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
